version: '3.8'

services:
  # ==========================================
  # SERVIZI INFRASTRUTTURALI (I Pilastri)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: taasselunga-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db_inventory # Usiamo un unico DB condiviso per comodità in Docker
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - taasselunga-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: taasselunga-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    depends_on:
      - postgres
    networks:
      - taasselunga-network

  # ==========================================
  # MICROSERVIZI DI BUSINESS (Backend Java)
  # ==========================================
  inventory-service:
    build: ./inventory-service
    container_name: taasselunga-inventory
    ports:
      - "8081:8081"
    environment:
      # Sovrascriviamo le impostazioni per usare i nomi dei container invece di localhost
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/db_inventory
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - taasselunga-network

  procurement-service:
    build: ./procurement-service
    container_name: taasselunga-procurement
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/db_procurement
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - taasselunga-network

  point-of-sale-service:
    build: ./point-of-sale-service
    container_name: taasselunga-pos
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/db_pos
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - taasselunga-network

  # ==========================================
  # MICROSERVIZIO TECNICO (Node.js)
  # ==========================================
  notification-service:
    build: ./notification-service
    container_name: taasselunga-notification
    ports:
      - "8083:8083"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
    networks:
      - taasselunga-network

  # ==========================================
  # API GATEWAY (Il Vigile Urbano)
  # ==========================================
  api-gateway:
    build: ./api-gateway
    container_name: taasselunga-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - inventory-service
      - procurement-service
      - point-of-sale-service
    networks:
      - taasselunga-network

# ==========================================
# CONFIGURAZIONI GLOBALI
# ==========================================
volumes:
  postgres-data:

networks:
  taasselunga-network:
    driver: bridge