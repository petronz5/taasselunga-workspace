version: '3.8'

services:

  # ==========================================
  # DATABASE POSTGRES - Memorizza i dati dei microservizi
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: taasselunga-postgres

    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres

    ports:
      - "5434:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - taasselunga-network


  # ==========================================
  # RABBITMQ - Comunicazione asincrona tra microservizi
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: taasselunga-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    ports:
      - "5672:5672"
      - "15672:15672"

    networks:
      - taasselunga-network


  # ==========================================
  # KEYCLOAK - Authentication Server OAuth2/OIDC
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: taasselunga-keycloak

    command: start-dev --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"

    ports:
      - "9090:8080"

    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/taasselunga-realm.json:/opt/keycloak/data/import/taasselunga-realm.json

    networks:
      - taasselunga-network


  # ==========================================
  # INVENTORY SERVICE - Gestione Magazzino
  # ==========================================
  inventory-service:
    build: ./inventory-service
    container_name: taasselunga-inventory

    ports:
      - "8081:8081"

    environment:
      # Attiva application-docker.yml
      - SPRING_PROFILES_ACTIVE=docker

    # Permette al container di raggiungere Keycloak esposto sull'host
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - postgres
      - rabbitmq
      - keycloak

    networks:
      - taasselunga-network


  # ==========================================
  # PROCUREMENT SERVICE - Approvvigionamento
  # ==========================================
  procurement-service:
    build: ./procurement-service
    container_name: taasselunga-procurement

    ports:
      - "8082:8082"

    environment:
      # Attiva application-docker.yml
      - SPRING_PROFILES_ACTIVE=docker

    # Permette al container di raggiungere Keycloak esposto sull'host
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - postgres
      - rabbitmq
      - keycloak

    networks:
      - taasselunga-network


  # ==========================================
  # POINT OF SALE SERVICE - Gestione Punto Vendita
  # ==========================================
  point-of-sale-service:
    build: ./point-of-sale-service
    container_name: taasselunga-pos

    ports:
      - "8084:8084"

    environment:
      # Attiva application-docker.yml
      - SPRING_PROFILES_ACTIVE=docker

    # Permette al container di raggiungere Keycloak esposto sull'host
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - postgres
      - rabbitmq
      - keycloak
      - inventory-service

    networks:
      - taasselunga-network


  # ==========================================
  # NOTIFICATION SERVICE - Invio notifiche realtime
  # ==========================================
  notification-service:
    build: ./notification-service
    container_name: taasselunga-notification

    ports:
      - "8083:8083"

    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=db_notifications
      - DB_USER=root
      - DB_PASSWORD=password

    depends_on:
      - rabbitmq
      - postgres

    networks:
      - taasselunga-network


  # ==========================================
  # API GATEWAY - Punto di ingresso unico
  # ==========================================
  api-gateway:
    build: ./api-gateway
    container_name: taasselunga-api-gateway

    ports:
      - "8080:8080"

    environment:
      # Attiva application-docker.yml
      - SPRING_PROFILES_ACTIVE=docker

    # Permette al container di raggiungere Keycloak esposto sull'host
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - keycloak
      - inventory-service
      - procurement-service
      - point-of-sale-service
      - notification-service

    networks:
      - taasselunga-network


# ==========================================
# VOLUMI PERSISTENTI
# ==========================================
volumes:
  postgres-data:
  keycloak-data:


# ==========================================
# NETWORK CONDIVISA
# ==========================================
networks:
  taasselunga-network:
    driver: bridge