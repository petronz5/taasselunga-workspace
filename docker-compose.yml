services:

  # ==========================================
  # DATABASE POSTGRES - Memorizza i dati dei microservizi
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: taasselunga-postgres

    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres

    ports:
      - "5434:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d

    # ==========================================
    # Attende che Postgres sia pronto
    # ==========================================
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - taasselunga-network


  # ==========================================
  # RABBITMQ - Comunicazione asincrona tra microservizi
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: taasselunga-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    ports:
      - "5672:5672"
      - "15672:15672"

    networks:
      - taasselunga-network


  # ==========================================
  # INVENTORY SERVICE - Gestione Magazzino
  # ==========================================
  inventory-service:
    image: lucaads01/taasselunga-inventory-service:latest

    #Vecchia soluzione locale:
    build: ./inventory-service

    container_name: taasselunga-inventory

    ports:
      - "8081:8081"

    environment:
      # Attiva application-docker.yml
      - SPRING_PROFILES_ACTIVE=docker

    # ==========================================
    # DEPENDENCIES - Attende database e RabbitMQ
    # ==========================================
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

    networks:
      - taasselunga-network


  # ==========================================
  # PROCUREMENT SERVICE - Approvvigionamento
  # ==========================================
  procurement-service:
    image: lucaads01/taasselunga-procurement-service:latest

    # Vecchia soluzione locale:
    build: ./procurement-service

    container_name: taasselunga-procurement

    ports:
      - "8082:8082"

    environment:
      # Attiva application-docker.yml
      - SPRING_PROFILES_ACTIVE=docker

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ==========================================
    # DEPENDENCIES - Attende database e RabbitMQ
    # ==========================================
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

    networks:
      - taasselunga-network


  # ==========================================
  # POINT OF SALE SERVICE - Gestione Punto Vendita
  # ==========================================
  point-of-sale-service:
    image: lucaads01/taasselunga-point-of-sale-service:latest

    # Vecchia soluzione locale:
    build: ./point-of-sale-service

    container_name: taasselunga-pos

    ports:
      - "8084:8084"

    environment:
      # Attiva application-docker.yml
      - SPRING_PROFILES_ACTIVE=docker

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ==========================================
    # DEPENDENCIES - Attende database, RabbitMQ e Inventory
    # ==========================================
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      inventory-service:
        condition: service_started

    networks:
      - taasselunga-network


  # ==========================================
  # NOTIFICATION SERVICE - Invio notifiche realtime
  # ==========================================
  notification-service:
    image: lucaads01/taasselunga-notification-service:latest

    # Vecchia soluzione locale:
    build: ./notification-service

    container_name: taasselunga-notification

    ports:
      - "8083:8083"

    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=db_notifications
      - DB_USER=root
      - DB_PASSWORD=password

    # ==========================================
    # DEPENDENCIES - Attende Postgres pronto e RabbitMQ
    # ==========================================
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

    networks:
      - taasselunga-network


  # ==========================================
  # API GATEWAY - Punto di ingresso unico
  # ==========================================
  api-gateway:
    image: lucaads01/taasselunga-api-gateway:latest

    # Vecchia soluzione locale:
    build: ./api-gateway

    container_name: taasselunga-api-gateway

    ports:
      - "8080:8080"

    environment:
      # Attiva application-docker.yml
      - SPRING_PROFILES_ACTIVE=docker

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ==========================================
    # DEPENDENCIES - Attende tutti i microservizi
    # ==========================================
    depends_on:
      inventory-service:
        condition: service_started
      procurement-service:
        condition: service_started
      point-of-sale-service:
        condition: service_started
      notification-service:
        condition: service_started

    networks:
      - taasselunga-network


  # ==========================================
  # FRONTEND - Next.js
  # ==========================================
  frontend:
    image: lucaads01/taasselunga-frontend:latest

    #Vecchia soluzione locale:
    build:
      context: ./taasselunga-frontend
      args:
       NEXT_PUBLIC_API_URL: http://localhost:8080
       NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
       NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
       NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
       NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
       NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
       NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}

    container_name: taasselunga-frontend

    ports:
      - "3000:3000"

    # ==========================================
    # DEPENDENCIES - Attende Gateway e Notification Service
    # ==========================================
    depends_on:
      api-gateway:
        condition: service_started
      notification-service:
        condition: service_started

    networks:
      - taasselunga-network


# ==========================================
# VOLUMI PERSISTENTI
# ==========================================
volumes:
  postgres-data:


# ==========================================
# NETWORK CONDIVISA
# ==========================================
networks:
  taasselunga-network:
    driver: bridge