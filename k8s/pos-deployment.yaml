apiVersion: apps/v1
kind: Deployment
metadata:
  name: point-of-sale-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: point-of-sale-service
  template:
    metadata:
      labels:
        app: point-of-sale-service
    spec:
      containers:
        - name: point-of-sale-service
          image: lucaads01/taasselunga-point-of-sale-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"