server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/db_inventory
    username: root
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/taasselunga
          jwk-set-uri: http://keycloak:8080/realms/taasselunga/protocol/openid-connect/certs