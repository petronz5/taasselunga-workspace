server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/db_procurement
    username: root
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/taasselunga
          jwk-set-uri: http://host.docker.internal:9090/realms/taasselunga/protocol/openid-connect/certs