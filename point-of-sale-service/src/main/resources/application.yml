server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/db_pos
    username: root
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/taasselunga
          jwk-set-uri: http://localhost:9090/realms/taasselunga/protocol/openid-connect/certs

inventory:
  service:
    url: http://localhost:8081